<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Femdom Multiplayer – She Owns You (3D)</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<style>
  :root {
    --pink: #ff4d6d;
    --dark: #0a0306;
    --mid: #1a0a12;
    --light: #ffc2d1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--dark);
    color: var(--light);
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
  }
  h1 {
    font-size: 1.45rem;
    text-align: center;
    margin: 4px 0 8px;
    text-shadow: 0 0 14px var(--pink);
  }
  #lobby, #game { width: 100%; max-width: 480px; }
  .card {
    background: var(--mid);
    border: 2px solid var(--pink);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
  }
  button, input {
    width: 100%;
    padding: 11px;
    margin: 4px 0;
    border-radius: 9px;
    border: none;
    font-size: 0.95rem;
    font-weight: 600;
  }
  button {
    background: linear-gradient(180deg, #ff5a7a, #d01840);
    color: #fff;
    cursor: pointer;
    transition: 0.15s;
  }
  button:hover { transform: scale(1.03); filter: brightness(1.08); }
  button:active { transform: scale(0.97); }
  input {
    background: #2a1220;
    color: var(--light);
    border: 1px solid #ff4d6d55;
  }
  #stage {
    width: 100%;
    height: 420px;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid var(--pink);
    margin-bottom: 8px;
    background: #0a0306;
  }
  #status {
    text-align: center;
    font-size: 0.98rem;
    min-height: 2.5em;
    margin: 6px 0 8px;
    line-height: 1.3;
  }
  .role-badge {
    display: inline-block;
    background: linear-gradient(90deg, #ff4d6d, #b01030);
    color: #fff;
    padding: 3px 11px;
    border-radius: 16px;
    font-size: 0.8rem;
    margin-bottom: 6px;
  }
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
  }
  .controls button { margin: 0; font-size: 0.85rem; padding: 10px 5px; }
  #roomInfo { font-size: 0.85rem; opacity: 0.75; text-align: center; margin-top: 6px; }
  .hidden { display: none !important; }
  .note { font-size: 0.68rem; opacity: 0.4; text-align: center; margin-top: 12px; }
</style>
</head>
<body>
  <h1>She Owns You · 3D</h1>

  <div id="lobby">
    <div class="card">
      <p style="margin-bottom:8px;text-align:center;">Choose your role. Mistress controls everything.</p>
      <button id="btnMistress">I am the Mistress</button>
      <button id="btnSub">I am the Sub</button>
    </div>
    <div id="mistressSetup" class="card hidden">
      <p>Create a room for your sub.</p>
      <button id="btnCreate">Create Room</button>
      <div id="roomCodeDisplay" class="hidden" style="margin-top:10px;text-align:center;">
        <p>Room Code:</p>
        <p id="codeText" style="font-size:1.8rem;letter-spacing:4px;color:#fff;font-weight:700;"></p>
      </div>
    </div>
    <div id="subSetup" class="card hidden">
      <p>Enter the code from your Mistress.</p>
      <input id="joinCode" placeholder="Room code" maxlength="6" style="text-transform:uppercase;">
      <button id="btnJoin">Join & Obey</button>
    </div>
  </div>

  <div id="game" class="hidden">
    <div class="role-badge" id="roleBadge"></div>
    <div id="stage"></div>
    <div id="status">Waiting for Mistress...</div>
    <div id="mistressControls" class="controls hidden">
      <button data-pose="ride">Ride Him</button>
      <button data-pose="spank">Spank Him</button>
      <button data-pose="facesit">Face Sit</button>
      <button data-pose="asslick">Make Him Lick</button>
      <button data-pose="bondage">Bondage</button>
      <button id="btnIntense">Toggle Intensity</button>
    </div>
    <div id="roomInfo"></div>
  </div>

  <p class="note">100% free · Three.js 3D · PeerJS multiplayer · No paid / copyrighted assets</p>

<script>
/* ========= STATE ========= */
let role = null, peer = null, conn = null;
let currentPose = 'ride', intense = false;
let scene, camera, renderer, mistress, sub, clock;
let animTime = 0;

const statusEl = document.getElementById('status');
const texts = {
  ride: "She's riding you. Hips locked. She decides the pace.",
  spank: "Her hand swings down. Take every impact.",
  facesit: "Full weight on your face. Tongue out. Breathe when allowed.",
  asslick: "Face buried. Lick properly. She feels every stroke.",
  bondage: "Arms locked behind. Completely useless until she says otherwise."
};

function show(el){ el.classList.remove('hidden'); }
function hide(el){ el.classList.add('hidden'); }

/* ========= 3D CHARACTER BUILDER ========= */
function makeMaterial(color, roughness=0.55) {
  return new THREE.MeshStandardMaterial({ color, roughness, metalness: 0.05 });
}

function createLimb(len, radius, mat) {
  const geo = new THREE.CapsuleGeometry(radius, len - radius*2, 6, 8);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  return mesh;
}

function createCharacter(isMistress) {
  const root = new THREE.Group();
  const skin = isMistress ? 0xf5c9b0 : 0xe0b08a;
  const clothes = isMistress ? 0xc01840 : 0x1e3a5c;
  const hairCol = isMistress ? 0x2c1810 : 0x1a1210;
  const skinMat = makeMaterial(skin);
  const clothMat = makeMaterial(clothes, 0.7);
  const hairMat = makeMaterial(hairCol, 0.8);

  // Hips
  const hips = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), clothMat);
  hips.scale.set(1.15, 0.7, 0.9);
  hips.position.y = 0.95;
  root.add(hips);

  // Torso
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 0.45, 6, 10), clothMat);
  torso.position.y = 1.35;
  root.add(torso);

  // Breasts (mistress only)
  if (isMistress) {
    const bL = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 8), makeMaterial(0xff8fb0, 0.45));
    bL.position.set(-0.13, 1.42, 0.16);
    const bR = bL.clone();
    bR.position.x = 0.13;
    root.add(bL, bR);
  }

  // Head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 14, 12), skinMat);
  head.position.y = 1.85;
  root.add(head);

  // Hair
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 10), hairMat);
  hair.position.y = 1.95;
  hair.scale.set(1.05, 0.9, 1.05);
  root.add(hair);
  if (isMistress) {
    // longer side hair
    const sideL = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.45, 4, 6), hairMat);
    sideL.position.set(-0.22, 1.7, 0);
    sideL.rotation.z = 0.3;
    const sideR = sideL.clone();
    sideR.position.x = 0.22;
    sideR.rotation.z = -0.3;
    root.add(sideL, sideR);
  }

  // Eyes
  const eyeMat = makeMaterial(0x222222);
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.03, 6, 6), eyeMat);
  eyeL.position.set(-0.07, 1.88, 0.15);
  const eyeR = eyeL.clone();
  eyeR.position.x = 0.07;
  root.add(eyeL, eyeR);

  // Arms (hierarchical)
  function makeArm(side) {
    const armRoot = new THREE.Group();
    armRoot.position.set(side * 0.28, 1.55, 0);
    const upper = createLimb(0.38, 0.055, skinMat);
    upper.position.y = -0.19;
    armRoot.add(upper);
    const lower = createLimb(0.34, 0.05, skinMat);
    lower.position.y = -0.55;
    armRoot.add(lower);
    root.add(armRoot);
    return armRoot;
  }
  const armL = makeArm(-1);
  const armR = makeArm(1);

  // Legs
  function makeLeg(side) {
    const legRoot = new THREE.Group();
    legRoot.position.set(side * 0.12, 0.95, 0);
    const upper = createLimb(0.42, 0.07, skinMat);
    upper.position.y = -0.21;
    legRoot.add(upper);
    const lower = createLimb(0.4, 0.06, skinMat);
    lower.position.y = -0.62;
    legRoot.add(lower);
    root.add(legRoot);
    return legRoot;
  }
  const legL = makeLeg(-1);
  const legR = makeLeg(1);

  root.userData = { armL, armR, legL, legR, head, hips, torso };
  return root;
}

/* ========= SCENE SETUP ========= */
function init3D() {
  const container = document.getElementById('stage');
  const w = container.clientWidth;
  const h = container.clientHeight;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0306);
  scene.fog = new THREE.Fog(0x0a0306, 4, 12);

  camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 50);
  camera.position.set(0, 1.6, 4.2);
  camera.lookAt(0, 1.2, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  // Lights
  const amb = new THREE.AmbientLight(0xffaabb, 0.45);
  scene.add(amb);
  const key = new THREE.DirectionalLight(0xffe0e8, 1.1);
  key.position.set(2, 4, 3);
  key.castShadow = true;
  scene.add(key);
  const fill = new THREE.DirectionalLight(0x88aaff, 0.35);
  fill.position.set(-2, 2, -1);
  scene.add(fill);
  const rim = new THREE.PointLight(0xff4d6d, 0.6, 8);
  rim.position.set(0, 2.5, -2);
  scene.add(rim);

  // Floor
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(3, 32),
    new THREE.MeshStandardMaterial({ color: 0x1a0a12, roughness: 0.9 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // Characters
  mistress = createCharacter(true);
  mistress.position.set(0.15, 0, 0.1);
  scene.add(mistress);

  sub = createCharacter(false);
  sub.position.set(-0.05, 0, -0.15);
  sub.scale.set(0.95, 0.95, 0.95);
  scene.add(sub);

  clock = new THREE.Clock();
  applyPose('ride', false);
  animate();
}

/* ========= POSES & ANIMATION ========= */
function applyPose(pose, isIntense) {
  currentPose = pose;
  intense = !!isIntense;
  statusEl.textContent = texts[pose] + (intense ? '  ·  HARDER.' : '');

  // Reset base rotations
  const m = mistress.userData;
  const s = sub.userData;

  // Default neutral-ish
  m.armL.rotation.set(0, 0, 0.25);
  m.armR.rotation.set(0, 0, -0.25);
  m.legL.rotation.set(0, 0, 0.08);
  m.legR.rotation.set(0, 0, -0.08);
  m.head.rotation.set(0, 0, 0);
  s.armL.rotation.set(0, 0, 0.2);
  s.armR.rotation.set(0, 0, -0.2);
  s.legL.rotation.set(0, 0, 0.1);
  s.legR.rotation.set(0, 0, -0.1);
  s.head.rotation.set(0, 0, 0);

  mistress.position.set(0.15, 0, 0.1);
  mistress.rotation.set(0, 0, 0);
  sub.position.set(-0.05, 0, -0.15);
  sub.rotation.set(0, 0, 0);
  sub.scale.set(0.95, 0.95, 0.95);

  if (pose === 'ride') {
    mistress.position.set(0.05, 0.35, 0.05);
    m.legL.rotation.z = 0.55;
    m.legR.rotation.z = -0.55;
    m.armL.rotation.z = 0.4;
    m.armR.rotation.z = -0.4;
    sub.position.set(0, 0, 0);
    s.armL.rotation.z = 0.3;
    s.armR.rotation.z = -0.3;
  } else if (pose === 'spank') {
    mistress.position.set(-0.55, 0.1, 0.2);
    mistress.rotation.y = 0.4;
    m.armR.rotation.z = -1.4;
    m.armR.rotation.x = -0.3;
    m.legL.rotation.z = 0.25;
    sub.position.set(0.4, 0, -0.1);
    sub.rotation.y = -0.5;
    sub.rotation.z = 0.25;
    s.armL.rotation.z = -0.8;
    s.armR.rotation.z = 0.9;
  } else if (pose === 'facesit') {
    mistress.position.set(0.05, 0.85, 0.1);
    m.legL.rotation.z = 0.9;
    m.legR.rotation.z = -0.9;
    m.legL.rotation.x = 0.3;
    m.legR.rotation.x = 0.3;
    sub.position.set(0, 0, 0);
    sub.scale.set(0.9, 0.9, 0.9);
    s.head.rotation.x = -0.4;
  } else if (pose === 'asslick') {
    mistress.position.set(-0.7, 0.15, 0.15);
    mistress.rotation.y = 0.6;
    mistress.rotation.z = -0.25;
    m.armL.rotation.z = 0.6;
    sub.position.set(0.55, 0.25, -0.05);
    sub.rotation.z = 0.9;
    sub.rotation.y = -0.4;
    s.head.rotation.x = -0.5;
    s.armL.rotation.z = 1.1;
  } else if (pose === 'bondage') {
    mistress.position.set(0.2, 0.2, 0.1);
    m.armL.rotation.z = 0.2;
    m.armR.rotation.z = -0.2;
    sub.position.set(-0.1, 0, 0);
    s.armL.rotation.z = -1.7;
    s.armR.rotation.z = 1.7;
    s.armL.rotation.x = 0.4;
    s.armR.rotation.x = 0.4;
    s.legL.rotation.z = 0.4;
    s.legR.rotation.z = -0.4;
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  animTime += dt;

  if (intense && mistress && sub) {
    const m = mistress.userData;
    const s = sub.userData;
    const t = animTime;

    if (currentPose === 'ride') {
      mistress.position.y = 0.35 + Math.sin(t * 9) * 0.08;
    } else if (currentPose === 'spank') {
      m.armR.rotation.z = -1.0 + Math.sin(t * 11) * 0.55;
    } else if (currentPose === 'facesit') {
      mistress.position.y = 0.85 + Math.sin(t * 7) * 0.05;
    } else if (currentPose === 'asslick') {
      s.head.rotation.x = -0.5 + Math.sin(t * 10) * 0.12;
      s.head.position.z = Math.sin(t * 10) * 0.02;
    } else if (currentPose === 'bondage') {
      sub.rotation.z = Math.sin(t * 4) * 0.06;
    }
  }

  renderer.render(scene, camera);
}

/* ========= MULTIPLAYER ========= */
function broadcast(data) {
  if (conn && conn.open) conn.send(data);
}

function setPose(pose, isIntense) {
  applyPose(pose, isIntense);
}

function initPeer(id) {
  peer = new Peer(id, { debug: 1 });
  peer.on('open', (id) => {
    if (role === 'mistress') {
      document.getElementById('codeText').textContent = id.toUpperCase();
      show(document.getElementById('roomCodeDisplay'));
      document.getElementById('roomInfo').textContent = 'Room: ' + id.toUpperCase() + ' · Waiting...';
    }
  });
  peer.on('connection', (c) => { conn = c; setupConn(); });
  peer.on('error', (err) => { statusEl.textContent = 'Error: ' + err.type; });
}

function setupConn() {
  conn.on('open', () => {
    document.getElementById('roomInfo').textContent = 'Connected · Mistress in control';
    if (role === 'mistress') broadcast({ type: 'state', pose: currentPose, intense });
    hide(document.getElementById('lobby'));
    show(document.getElementById('game'));
    document.getElementById('roleBadge').textContent = role === 'mistress' ? 'MISTRESS' : 'SUB – OBEY';
    if (role === 'mistress') show(document.getElementById('mistressControls'));
    if (!renderer) init3D();
  });
  conn.on('data', (data) => {
    if (data.type === 'state') setPose(data.pose, data.intense);
  });
  conn.on('close', () => { statusEl.textContent = 'Connection closed.'; });
}

/* ========= UI ========= */
document.getElementById('btnMistress').onclick = () => {
  role = 'mistress';
  hide(document.getElementById('btnMistress'));
  hide(document.getElementById('btnSub'));
  show(document.getElementById('mistressSetup'));
};
document.getElementById('btnSub').onclick = () => {
  role = 'sub';
  hide(document.getElementById('btnMistress'));
  hide(document.getElementById('btnSub'));
  show(document.getElementById('subSetup'));
};
document.getElementById('btnCreate').onclick = () => {
  const id = Math.random().toString(36).substring(2, 8);
  initPeer(id);
};
document.getElementById('btnJoin').onclick = () => {
  const code = document.getElementById('joinCode').value.trim().toLowerCase();
  if (!code) return;
  initPeer();
  peer.on('open', () => {
    conn = peer.connect(code);
    setupConn();
  });
};

document.querySelectorAll('#mistressControls button[data-pose]').forEach(btn => {
  btn.onclick = () => {
    const pose = btn.dataset.pose;
    setPose(pose, intense);
    broadcast({ type: 'state', pose, intense });
  };
});
document.getElementById('btnIntense').onclick = () => {
  intense = !intense;
  setPose(currentPose, intense);
  broadcast({ type: 'state', pose: currentPose, intense });
};

// Solo demo
window.startDemo = function() {
  role = 'mistress';
  hide(document.getElementById('lobby'));
  show(document.getElementById('game'));
  document.getElementById('roleBadge').textContent = 'DEMO (Mistress)';
  show(document.getElementById('mistressControls'));
  init3D();
  setPose('ride', false);
};

window.addEventListener('resize', () => {
  if (!renderer) return;
  const c = document.getElementById('stage');
  camera.aspect = c.clientWidth / c.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(c.clientWidth, c.clientHeight);
});
</script>
</body>
</html>
